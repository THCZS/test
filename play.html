<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>test play</title>
<style>
  body {
    font-family: Arial, sans-serif;
  }
  .carousel {
    position: relative;
    width: 600px;
    margin: 50px auto;
    overflow: hidden;
    border: 2px solid #ccc;
  }
  .slides {
    display: flex;
    width: 100%;
    transition: transform 0.5s ease-in-out;
  }
  .slide {
    min-width: 600px;
    height: 300px;
    background-size: cover;
    background-position: center;
  }
  /* 示例背景色 */
  .slide1 { background-color: #f44336; }
  .slide2 { background-color: #2196F3; }
  .slide3 { background-color: #4CAF50; }
  .slide4 { background-color: #FFEB3B; }
  .slide5 { background-color: #9C27B0; }

  .buttons {
    position: absolute;
    top: 50%;
    width: 100%;
    display: flex;
    justify-content: space-between;
    transform: translateY(-50%);
  }
  .btn {
    background-color: rgba(0,0,0,0.5);
    border: none;
    color: white;
    font-size: 24px;
    padding: 10px 20px;
    cursor: pointer;
  }

  .indicators {
    text-align: center;
    margin-top: 10px;
  }
  .indicator {
    display: inline-block;
    width: 25px;
    height: 25px;
    line-height: 25px;
    margin: 0 5px;
    background-color: #ddd;
    color: #333;
    border-radius: 50%;
    cursor: pointer;
    user-select: none;
  }
  .indicator.active {
    background-color: #333;
    color: white;
  }
</style>
</head>
<body>

<div class="carousel">
  <div class="slides" id="slides">
    <div class="slide slide1">1</div>
    <div class="slide slide2">2</div>
    <div class="slide slide3">3</div>
    <div class="slide slide4">4</div>
    <div class="slide slide5">5</div>
  </div>
  <div class="buttons">
    <button class="btn" id="prevBtn">&#10094;</button>
    <button class="btn" id="nextBtn">&#10095;</button>
  </div>
</div>
<div class="indicators" id="indicators">
  <span class="indicator active">1</span>
  <span class="indicator">2</span>
  <span class="indicator">3</span>
  <span class="indicator">4</span>
  <span class="indicator">5</span>
</div>

<script>
  const slides = document.getElementById('slides');
  const indicators = document.querySelectorAll('.indicator');
  const prevBtn = document.getElementById('prevBtn');
  const nextBtn = document.getElementById('nextBtn');
  const totalSlides = indicators.length;
  let currentIndex = 0;

  function updateCarousel() {
    slides.style.transform = `translateX(${-currentIndex * 600}px)`;
    indicators.forEach((ind, idx) => {
      ind.classList.toggle('active', idx === currentIndex);
    });
  }

  prevBtn.addEventListener('click', () => {
    currentIndex = (currentIndex - 1 + totalSlides) % totalSlides;
    updateCarousel();
  });

  nextBtn.addEventListener('click', () => {
    currentIndex = (currentIndex + 1) % totalSlides;
    updateCarousel();
  });

  indicators.forEach((ind, idx) => {
    ind.addEventListener('click', () => {
      currentIndex = idx;
      updateCarousel();
    });
  });
</script>

</body>
</html>
